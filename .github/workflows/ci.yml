name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Home Assistant (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [minimum, latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum.txt
      - name: Install compatible test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [[ "${{ matrix.target }}" == "minimum" ]]; then
            python -m pip install -e ".[test]" -c constraints/minimum.txt
          else
            python -m pip install --upgrade -e ".[test]"
          fi
          python -m pip check
      - name: Report tested versions
        run: python -m pip show homeassistant pytest-homeassistant-custom-component
      - name: Lint
        run: python -m ruff check .
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check physical file sizes
        run: python scripts/check_file_sizes.py
      - name: Test integration lifecycle and source quality
        run: python -m pytest -q
      - name: Preview semantic version
        run: python scripts/semantic_version.py

  version:
    name: Bump version on main
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: semantic-version-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Check that the tested commit is still main
        id: head
        shell: bash
        run: |
          git fetch origin main --tags
          if [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Main advanced; its own CI run will calculate the next version."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump Python and integration versions
        id: bump
        if: steps.head.outputs.current == 'true'
        run: python scripts/semantic_version.py --apply --github-output "$GITHUB_OUTPUT"
      - name: Commit and tag atomically
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml custom_components/track_things/manifest.json
          git commit -m "chore(release): v${VERSION} [skip ci]"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${VERSION}"
