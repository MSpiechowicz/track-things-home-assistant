get_daily_calendar:
  name: Get daily calendar
  description: Return complete recorded entries and an English or Polish summary for a local day.
  fields:
    config_entry_id:
      name: Account instance
      required: true
      selector:
        config_entry:
          integration: track_things
    date:
      name: Date
      description: Defaults to today in the Home Assistant timezone.
      selector:
        date:
    trackerId:
      name: Tracker ID
      description: Optional tracker belonging to this instance and its selected trackers.
      selector:
        text:
    subjectId:
      name: Subject ID
      description: Optional recorded subject belonging to this workspace, including archived subjects.
      selector:
        text:
    language:
      name: Summary language
      default: en
      selector:
        select:
          options:
            - en
            - pl
refresh:
  name: Refresh
  description: Refresh workspace metadata and invalidate cached calendar ranges.
  fields:
    config_entry_id:
      name: Account instance
      required: true
      selector:
        config_entry:
          integration: track_things
create_entry:
  name: Create entry
  description: Create a manual entry using fresh metadata, schema validation, and a durable retry key. Returns entry and request_id.
  fields:
    config_entry_id:
      name: Account instance
      required: true
      selector:
        config_entry:
          integration: track_things
    trackerId:
      name: Tracker ID
      required: true
      selector:
        text:
    subjectId:
      name: Assigned subject ID
      required: true
      selector:
        text:
    occurredAt:
      name: Occurrence timestamp
      description: ISO timestamp with timezone. Keep this exact value when retrying.
      required: true
      selector:
        text:
    values:
      name: Detail values
      required: true
      selector:
        object:
    periodStart:
      name: Period start
      description: Optional ISO timestamp with timezone, or null.
      selector:
        text:
    periodEnd:
      name: Period end
      description: Optional ISO timestamp with timezone, or null.
      selector:
        text:
    title:
      name: Title
      selector:
        text:
    note:
      name: Note
      selector:
        text:
          multiline: true
    tagIds:
      name: Tag IDs
      description: Up to 50 unique workspace tag UUIDs.
      selector:
        object:
    request_id:
      name: Request ID
      description: Reuse for identical retries. Omit to generate a UUID; returned with the entry.
      selector:
        text:
get_recording_options:
  name: Get recording options
  description: Discover available tracker and subject names, field labels, types, constraints and choice labels before recording. Never guess ambiguous names.
  fields:
    config_entry_id:
      name: Account instance
      required: true
      selector:
        config_entry:
          integration: track_things
record_entry:
  name: Record entry by name
  description: Record using tracker and subject names. Use field and value for a simple entry or values for multiple fields. Discover names with Get recording options. Ambiguous names require clarification.
  fields:
    config_entry_id:
      name: Account instance
      required: true
      selector:
        config_entry:
          integration: track_things
    tracker:
      name: Tracker
      description: Exact tracker name, such as Health check-in. A unique ID is also accepted.
      required: true
      selector:
        text:
    subject:
      name: Subject
      description: Assigned subject name, such as Barbara. A unique ID is also accepted.
      required: true
      selector:
        text:
    date:
      name: Date
      description: Optional calendar date. YAML and voice adapters also accept today, tomorrow or yesterday in the Home Assistant timezone. Defaults to now.
      selector:
        date:
    number:
      name: Number
      description: A numeric value, such as pain 4. Use instead of Value for numeric fields.
      selector:
        number:
          mode: box
          step: any
    field:
      name: Field
      description: Field label, such as Wellbeing. Optional when the tracker has only one field.
      selector:
        text:
    value:
      name: Value
      description: A typed value such as 3, true, or a choice label. Use YAML mode for a typed scalar; do not wrap it in an object.
      selector:
        object:
    values:
      name: Multiple field values
      description: Map field labels or keys to typed values. Use instead of Field and Value.
      selector:
        object:
    occurred_at:
      name: Recorded at
      description: Defaults to now. For retries, reuse the original timezone-qualified timestamp.
      selector:
        text:
    request_id:
      name: Request ID
      description: For retries only. Reuse the original request ID, timestamp and identical data.
      selector:
        text:
