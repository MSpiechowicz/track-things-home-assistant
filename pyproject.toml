[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "track-things-home-assistant"
version = "0.8.0"
description = "Home Assistant custom integration for Track Things"
readme = "README.md"
requires-python = ">=3.14.2"
license = "GPL-3.0-only"

[project.optional-dependencies]
test = [
  "homeassistant>=2026.9.0",
  "pytest-homeassistant-custom-component>=0.13.363",
  "ruff>=0.15,<1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
# Include the namespace root so editable installs expose real filesystem paths
# to Home Assistant's custom-component directory scanner.
include = ["custom_components*"]
namespaces = true

[tool.setuptools.package-data]
"custom_components.track_things" = ["manifest.json", "strings.json", "translations/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
